<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuk Studios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a1a, #333333);
            color: white;
            text-align: center;
            animation: fadeIn 1s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        header {
            background: #2a2a2a;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            animation: slideDown 0.8s ease-out;
        }
        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .nav-buttons {
            margin-top: 20px;
        }
        .nav-buttons button {
            background: #444;
            border: none;
            color: white;
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s, transform 0.2s;
            animation: fadeIn 1.2s ease-in;
        }
        .nav-buttons button:hover {
            background: #666;
            transform: scale(1.1);
        }
        .content {
            margin-top: 50px;
            font-size: 20px;
            animation: fadeIn 1.5s ease-in;
        }
    </style>
</head>
<body>
    <header>Nuk Studios</header>
    <div class="nav-buttons">
        <button>Games</button>
        <button>About Us</button>
        <button>Development Packages</button>
    </div>
    <div class="content">
        <p>Welcome to Nuk Studios, where games meets creativity.</p>
    </div>
</body>
</html>
